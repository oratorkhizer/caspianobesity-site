<text x="372.5" y="357.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0e2643" text-anchor="middle" >only “overweight” on the international scale</text>
<rect x="40" y="408" width="560" height="70" rx="12" fill="#0e2643"/>
