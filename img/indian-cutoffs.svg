<text x="40.0" y="48.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0e2643" text-anchor="start" >International (WHO)</text>
<rect x="40" y="60" width="245" height="46" fill="#dfe8f1"/>
<rect x="285" y="60" width="175" height="46" fill="#e7c65a"/>
