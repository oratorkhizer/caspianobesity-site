<text x="372.5" y="90.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#091a31" text-anchor="middle" >Overweight</text>
<text x="536.0" y="90.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >Obesity</text>
<text x="40.0" y="202.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0e2643" text-anchor="start" >Asian-Indian</text>
<rect x="40" y="214" width="175" height="46" fill="#dfe8f1"/>
<rect x="215" y="214" width="70" height="46" fill="#e7c65a"/>
