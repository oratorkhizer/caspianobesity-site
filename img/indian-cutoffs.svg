<text x="372.5" y="244.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >Obesity</text>
<text x="250.0" y="282.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8a6d12" text-anchor="middle" >Overweight</text>
