<text x="140.0" y="438.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#cfdbe8" text-anchor="start" >Waist that signals abdominal obesity</text>
<text x="140.0" y="463.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="start" >Men 90 cm or more  ·  Women 80 cm or more</text>
<text x="40.0" y="506.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5a6b7a" text-anchor="start" >Source: Misra A, et al. Consensus statement for Asian Indians. J Assoc Physicians India 2009;57:163–70.</text>
