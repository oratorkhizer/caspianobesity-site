<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-labelledby="t d">
<title id="t">Asian-Indian cut-offs act earlier</title>
<desc id="d">Two BMI scales. On the WHO scale overweight starts at 25 and obesity at 30. On the Asian-Indian scale overweight starts at 23 and obesity at 25. A BMI of 25 to 29.9 is obesity in an Indian patient but only overweight on the international scale. Waist cut-offs: men 90 cm or more, women 80 cm or more.</desc>
