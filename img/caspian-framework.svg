<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" width="820" height="640" role="img" aria-labelledby="t d">
<title id="t">The CASPIAN framework</title>
<desc id="d">Seven steps arranged around a circle in order: Classify, Assess, Screen, Personalise, Intervene, Anchor, Nurture. In the centre: one system for every patient who walks in.</desc>
<defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7c65a"/><stop offset="1" stop-color="#c9a227"/></linearGradient><linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14375d"/><stop offset="1" stop-color="#0e2643"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9a227"/></marker></defs>
<circle cx="410" cy="320" r="178" fill="none" stroke="#e2e6ea" stroke-width="16"/>
<path d="M453.1 147.3 A178 178 0 0 1 515.7 176.8" fill="none" stroke="#c9a227" stroke-width="4" marker-end="url(#arr)"/>
<path d="M571.9 246.0 A178 178 0 0 1 587.9 313.3" fill="none" stroke="#c9a227" stroke-width="4" marker-end="url(#arr)"/>
<path d="M568.8 400.4 A178 178 0 0 1 526.1 454.9" fill="none" stroke="#c9a227" stroke-width="4" marker-end="url(#arr)"/>
<path d="M446.1 494.3 A178 178 0 0 1 376.9 494.9" fill="none" stroke="#c9a227" stroke-width="4" marker-end="url(#arr)"/>
<path d="M296.3 456.9 A178 178 0 0 1 252.6 403.2" fill="none" stroke="#c9a227" stroke-width="4" marker-end="url(#arr)"/>
<path d="M232.0 316.4 A178 178 0 0 1 246.9 248.8" fill="none" stroke="#c9a227" stroke-width="4" marker-end="url(#arr)"/>
<circle cx="410" cy="320" r="112" fill="url(#navy)"/>
<text x="410.0" y="306.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" >One system</text>
<text x="410.0" y="334.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" >for every patient</text>
<text x="410.0" y="366.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e7c65a" text-anchor="middle" >who walks in</text>
<circle cx="410.0" cy="142.0" r="34" fill="url(#gold)" stroke="#fff" stroke-width="4"/>
<text x="410.0" y="153.0" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#091a31" text-anchor="middle" >C</text>
<text x="410.0" y="76.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0e2643" text-anchor="middle" >Classify</text>
<text x="410.0" y="98.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5a6b7a" text-anchor="middle" >Stage the disease</text>
<circle cx="549.2" cy="209.0" r="34" fill="url(#gold)" stroke="#fff" stroke-width="4"/>
<text x="549.2" y="220.0" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#091a31" text-anchor="middle" >A</text>
<text x="597.2" y="208.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0e2643" text-anchor="start" >Assess</text>
<text x="597.2" y="230.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5a6b7a" text-anchor="start" >Waist, risk, root causes</text>
<circle cx="583.5" cy="359.6" r="34" fill="url(#gold)" stroke="#fff" stroke-width="4"/>
<text x="583.5" y="370.6" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#091a31" text-anchor="middle" >S</text>
<text x="631.5" y="358.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0e2643" text-anchor="start" >Screen</text>
<text x="631.5" y="380.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5a6b7a" text-anchor="start" >Complications</text>
<circle cx="487.2" cy="480.4" r="34" fill="url(#gold)" stroke="#fff" stroke-width="4"/>
<text x="487.2" y="491.4" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#091a31" text-anchor="middle" >P</text>
<text x="535.2" y="479.4" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0e2643" text-anchor="start" >Personalise</text>
<text x="535.2" y="501.4" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5a6b7a" text-anchor="start" >Plan to patient</text>
<circle cx="332.8" cy="480.4" r="34" fill="url(#gold)" stroke="#fff" stroke-width="4"/>
<text x="332.8" y="491.4" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#091a31" text-anchor="middle" >I</text>
<text x="284.8" y="479.4" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0e2643" text-anchor="end" >Intervene</text>
<text x="284.8" y="501.4" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5a6b7a" text-anchor="end" >Diet, drugs, devices, surgery</text>
<circle cx="236.5" cy="359.6" r="34" fill="url(#gold)" stroke="#fff" stroke-width="4"/>
<text x="236.5" y="370.6" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#091a31" text-anchor="middle" >A</text>
<text x="188.5" y="358.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0e2643" text-anchor="end" >Anchor</text>
<text x="188.5" y="380.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5a6b7a" text-anchor="end" >Hold the loss</text>
<circle cx="270.8" cy="209.0" r="34" fill="url(#gold)" stroke="#fff" stroke-width="4"/>
<text x="270.8" y="220.0" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#091a31" text-anchor="middle" >N</text>
<text x="222.8" y="208.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0e2643" text-anchor="end" >Nurture</text>
<text x="222.8" y="230.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5a6b7a" text-anchor="end" >Long-term, stigma-free care</text>
</svg>
