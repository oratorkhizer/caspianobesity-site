<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="t d">
<title id="t">One root, many diseases</title>
<desc id="d">A tree. Above the ground are five branches labelled type 2 diabetes, hypertension, fatty liver, sleep apnoea and PCOS. Below the ground a single root is labelled excess visceral fat.</desc>
